[workspace]
resolver = "2"
members = [
    "crates/innertube",
    "crates/player",
    "crates/listen-protocol",
    "crates/sync-server",
    "src-tauri",
]

[workspace.package]
version = "1.3.0-rc.2"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
listen-protocol = { path = "crates/listen-protocol" }

# Chromium (CEF) on Linux instead of WebKitGTK. The runtime lives on tauri's `feat/cef` branch,
# which still versions itself 2.x, so every crates.io `tauri*` crate in the graph (ours and the
# plugins') is redirected to the same commit; a second `tauri` would fail on its `links`. Pinned
# by rev: the branch moves daily. `dpi` follows winit-gtk4, the windowing crate the CEF runtime
# is built on, so its sizes and positions are the same type as tauri-runtime's. Not pinned: it
# has to resolve to the same source winit-gtk4 names (`branch = "master"`); Cargo.lock pins it.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }
# Release profile: thin LTO + one codegen unit for cross-crate optimization, symbols stripped
# for size (this binary ships via AppImage self-update — size = every user's download).
# panic stays "unwind": an abort in the mpv event thread or a tokio task would kill playback
# for the whole app instead of degrading.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
