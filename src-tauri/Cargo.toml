[package]
name = "limusic-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Limusic — desktop YouTube Music client"
# tauri's feat/cef branch (root Cargo.toml's [patch]) is edition 2024 and needs 1.95.
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
# No runtime of its own on the feat/cef branch: CEF on Linux, wry elsewhere (target sections below).
# `tray-icon` is in the non-Linux section: Linux draws its own tray with ksni (tray.rs), and with
# the feature on, the feat/cef CLI hunts for a GTK 3 appindicator to bundle and panics without one.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png"] }
# The crates.io plugins ask `tauri` for its `wry` feature, which the branch no longer has (the
# runtime is a separate crate there). plugins-workspace keeps a `feat/cef` branch without it.
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 2 extraction stack (cipher + PoToken). context/04, 05, 13.
# BotGuard runs under deno_core + JSDOM, NOT in a hidden webview. Every token a real browser engine
# mints is rejected by googlevideo; a minimal-DOM runtime is the only one that produces an accepted
# one. Measured in `progress/active/webremix-stream-403.md`. This pulls in V8.
rustypipe-botguard = "0.1.2"
base64 = "0.22"
regex = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
# Loopback HTTP server for the music-video proxy (videoproxy.rs). Already in the tree behind
# reqwest, so this pins nothing new; WebKitGTK's media backend will only load http/https/blob.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

innertube = { path = "../crates/innertube" }
player = { path = "../crates/player" }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
# Listen Together: shared wire types + WebSocket client (wss via rustls). context/19.
listen-protocol = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
discord-rich-presence = "1.1.0"
# Last.fm API signature (api_sig is md5 of the sorted params + secret), and the stable
# saved-account key (db.rs::account_key).
md-5 = "0.10"
lofty = "0.22.2"
# rfd's GTK 3 backend would load GTK 3 into a process CEF already runs GTK 4 in, and the two
# cannot coexist. The XDG desktop portal does the same dialogs over D-Bus.
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030", default-features = false, features = ["xdg-portal"] }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
# Romanized lyrics (#202, romanize.rs). lindera's build script downloads IPADIC (~12 MB, from
# GitHub) once and embeds it uncompressed (~45 MB in the binary, borrowed in place, never copied to
# the heap); rust-cache keeps it across CI runs. Held at 0.30: every lindera from 0.35 on needs
# encoding_rs >= 0.8.35, and rustypipe-botguard's deno_web pins =0.8.33. 0.31 to 0.34 fetch
# IPADIC from hosts that are gone. Move up when botguard does.
lindera = { version = "=0.30.0", default-features = false, features = ["ipadic"] }
wana_kana = { version = "5", default-features = false }
pinyin = { version = "0.11", default-features = false, features = ["with_tone"] }
any_ascii = "0.3"
# Track-change notifications (notify.rs): D-Bus on Linux, WinRT toasts, NSUserNotification.
notify-rust = "4"
# Spotify import (#375, spotify.rs + import.rs). All four were in the lockfile already: zip under
# the Windows updater, csv and unicode-normalization under lindera, strsim under clap.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
csv = "1"
strsim = "0.11"
unicode-normalization = "0.1"

# Taskbar thumbnail toolbar (#47). Same `windows` version tauri-runtime-wry already pulls in, so
# `Window::hwnd()` hands us a matching HWND.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-runtime-wry = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Chromium Embedded Framework. Depending on it is also what makes tauri-build and the feat/cef
# CLI fetch the CEF binary distribution and ship it in the bundle. Not on crates.io at this
# version, so straight from the commit root Cargo.toml patches the rest of tauri to.
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
ksni = "0.3.6"
libc = "0.2"
# Holding off suspend while playing (inhibit.rs, #347). Already in the tree through notify-rust.
zbus = "5"

# `webkitgtk` is never set. Upstream's WebKitGTK code stays in place under it, so merging upstream
# keeps applying cleanly while none of it is compiled; see src/cef.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(webkitgtk)"] }
